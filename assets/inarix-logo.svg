<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a5a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cfe6ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="fox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#b3111a"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d43"/>
      <stop offset="1" stop-color="#23252a"/>
    </linearGradient>
    <clipPath id="plateClip"><rect x="64" y="64" width="384" height="384" rx="80"/></clipPath>
    <clipPath id="screenClip"><rect x="144" y="144" width="224" height="142" rx="6"/></clipPath>
    <pattern id="scan" width="224" height="6" patternUnits="userSpaceOnUse" x="144" y="144">
      <rect width="224" height="2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Soft glow behind the logo -->
  <circle cx="300" cy="300" r="170" fill="url(#glow)">
    <animate attributeName="r" values="150;190;150" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Shockwave ring when the logo lands -->
  <circle cx="300" cy="300" r="60" fill="none" stroke="#ff5a5a" stroke-width="4" opacity="0">
    <animate attributeName="r" values="60;300" begin="0.9s" dur="1s" fill="freeze"/>
    <animate attributeName="opacity" values="0.9;0" begin="0.9s" dur="1s" fill="freeze"/>
    <animate attributeName="stroke-width" values="6;1" begin="0.9s" dur="1s" fill="freeze"/>
  </circle>

  <!-- Logo -->
  <g transform="translate(300 300) scale(0.6)">
    <!-- Idle breathing (starts after the intro) -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.025;1" begin="2.2s" dur="3.2s" repeatCount="indefinite" additive="sum"/>
      <!-- Intro scale: 0 -> 1.08 -> 1 -->
      <g>
        <animateTransform attributeName="transform" type="scale" values="0;1.08;1" keyTimes="0;0.7;1" begin="0.2s" dur="1s" calcMode="spline" keySplines="0.3 0 0.2 1;0.3 0 0.2 1" fill="freeze"/>
        <!-- Intro rotation: -25 -> 0 degrees -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-25;0" begin="0.2s" dur="1s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/>
          <g transform="translate(-256 -256)">
            <!-- Glass plate -->
            <rect x="64" y="64" width="384" height="384" rx="80" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>

            <g transform="translate(0,17)">
              <!-- Stand -->
              <rect x="240" y="300" width="32" height="40" fill="#2f3237"/>
              <rect x="200" y="336" width="112" height="12" rx="6" fill="#2f3237"/>
              <!-- Monitor -->
              <rect x="130" y="130" width="252" height="170" rx="14" fill="url(#bezel)"/>
              <rect x="144" y="144" width="224" height="142" rx="6" fill="#1c1d21"/>
              <!-- Scanlines -->
              <g clip-path="url(#screenClip)">
                <g>
                  <animateTransform attributeName="transform" type="translate" values="0 0;0 6" dur="0.3s" repeatCount="indefinite"/>
                  <rect x="144" y="138" width="224" height="160" fill="url(#scan)"/>
                </g>
              </g>

              <!-- Fox head -->
              <polygon points="200,150 226,192 256,184 286,192 312,150 322,210 306,256 256,284 206,256 190,210" fill="url(#fox)"/>
              <polygon points="200,150 226,192 210,208" fill="#ff8a80" fill-opacity="0.6"/>
              <polygon points="312,150 286,192 302,208" fill="#7a0a12" fill-opacity="0.5"/>
              <polygon points="190,210 210,208 226,192 256,184 256,226 206,234" fill="#ffffff" fill-opacity="0.18"/>
              <polygon points="322,210 302,208 286,192 256,184 256,226 306,234" fill="#000000" fill-opacity="0.2"/>
              <polygon points="206,234 256,226 256,284 206,256" fill="#000000" fill-opacity="0.15"/>
              <polygon points="306,234 256,226 256,284 306,256" fill="#ffffff" fill-opacity="0.08"/>
              <!-- Eyes flare and flicker -->
              <polygon points="216,212 240,206 242,220 220,224" fill="#2a0306">
                <animate attributeName="fill" values="#2a0306;#ff3b3b;#ffd0c8;#ff3b3b;#2a0306" keyTimes="0;0.25;0.45;0.7;1" begin="1.1s" dur="2s" repeatCount="indefinite"/>
              </polygon>
              <polygon points="296,212 272,206 270,220 292,224" fill="#2a0306">
                <animate attributeName="fill" values="#2a0306;#ff3b3b;#ffd0c8;#ff3b3b;#2a0306" keyTimes="0;0.25;0.45;0.7;1" begin="1.1s" dur="2s" repeatCount="indefinite"/>
              </polygon>
              <polygon points="250,250 262,250 256,264" fill="#2a0306"/>
            </g>

            <!-- Light sweep across the plate -->
            <g clip-path="url(#plateClip)">
              <g>
                <animateTransform attributeName="transform" type="translate" values="-150 0;550 0;550 0" keyTimes="0;0.3;1" dur="4s" begin="1.2s" repeatCount="indefinite"/>
                <rect x="0" y="0" width="80" height="512" fill="#ffffff" fill-opacity="0.45" transform="skewX(-20)"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
